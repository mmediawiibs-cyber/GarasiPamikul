<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garasi Pamikul — Asisten Mobil & Motor + Catatan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes pulseDot {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        .dot-1 { animation: pulseDot 1.2s infinite ease-in-out 0s; }
        .dot-2 { animation: pulseDot 1.2s infinite ease-in-out 0.2s; }
        .dot-3 { animation: pulseDot 1.2s infinite ease-in-out 0.4s; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased h-screen overflow-hidden flex flex-col selection:bg-blue-100 selection:text-blue-900">

    <!-- =================================================================== -->
    <!-- PIN LOCK OVERLAY (PROTEKSI AKSES MULTI-DEVICE)                      -->
    <!-- =================================================================== -->
    <div id="pinOverlay" class="fixed inset-0 z-50 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-sm w-full p-6 text-center space-y-5">
            <div class="w-14 h-14 rounded-2xl bg-slate-900 text-white flex items-center justify-center font-extrabold text-xl tracking-tight mx-auto shadow-md">
                GP
            </div>
            <div class="space-y-1">
                <h2 class="text-lg font-extrabold text-slate-900">Garasi Pamikul</h2>
                <p class="text-xs text-slate-500">Masukkan PIN akses untuk membuka garasi & sinkronisasi AI</p>
            </div>
            <form onsubmit="handlePinSubmit(event)" class="space-y-3">
                <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="Masukkan PIN..." required class="w-full text-center tracking-[0.35em] text-lg font-bold px-4 py-3 bg-slate-50 border border-slate-300 rounded-2xl focus:outline-none focus:bg-white focus:border-blue-600 focus:ring-4 focus:ring-blue-500/15 transition-all">
                <p id="pinErrorText" class="text-xs text-rose-600 font-medium hidden">PIN salah atau tidak valid.</p>
                <button id="pinSubmitBtn" type="submit" class="w-full py-3 px-4 rounded-2xl bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white text-sm font-bold shadow-sm transition-all">
                    Buka Garasi
                </button>
            </form>
        </div>
    </div>

    <!-- Mobile Drawers Backdrop -->
    <div id="drawerBackdrop" class="fixed inset-0 bg-slate-900/35 backdrop-blur-xs z-30 hidden lg:hidden transition-opacity" onclick="closeAllDrawers()"></div>

    <!-- =================================================================== -->
    <!-- TOP GLOBAL BAR: Brand + Menu Utama di Tengah Paling Atas            -->
    <!-- =================================================================== -->
    <header class="h-14 px-3 sm:px-5 bg-white border-b border-slate-200/90 flex items-center justify-between gap-2 shrink-0 z-20 shadow-2xs">
        <div class="flex items-center gap-2 min-w-0">
            <button onclick="toggleLeftPanel(true)" class="lg:hidden p-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 border border-slate-200/80" aria-label="Buka Panel Kendaraan & Mode" title="Kendaraan & Mode">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75"/></svg>
            </button>
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-slate-900 text-white flex items-center justify-center font-extrabold text-xs tracking-tight shadow-xs shrink-0">
                    GP
                </div>
                <div class="hidden sm:block leading-tight">
                    <h1 class="font-extrabold text-slate-900 text-sm tracking-tight">Garasi Pamikul</h1>
                    <p class="text-[10px] text-slate-500 font-medium">Asisten Mobil & Motor</p>
                </div>
            </div>
        </div>

        <nav aria-label="Menu Utama" class="flex items-center bg-slate-100/90 border border-slate-200/90 p-1 rounded-2xl shadow-inner max-w-full overflow-x-auto no-scrollbar">
            <button id="mainTabChat" onclick="switchView('chat')" class="px-3 sm:px-4 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all bg-white text-blue-700 shadow-xs whitespace-nowrap">
                <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                <span>Diskusi AI</span>
            </button>
            <button id="mainTabNotes" onclick="switchView('notes')" class="px-3 sm:px-4 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all text-slate-600 hover:text-slate-900 whitespace-nowrap">
                <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                <span>Catatan</span>
                <span id="notesCountBadge" class="px-1.5 py-0.2 rounded-full bg-slate-200 text-slate-700 text-[10px] font-bold">0</span>
            </button>
            <button id="mainTabVehicles" onclick="switchView('vehicles')" class="px-3 sm:px-4 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all text-slate-600 hover:text-slate-900 whitespace-nowrap">
                <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0 1.106 1.106 0 00-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12"/></svg>
                <span class="hidden md:inline">Daftar Kendaraan</span>
                <span class="md:hidden">Garasi</span>
                <span id="vehiclesCountBadge" class="px-1.5 py-0.2 rounded-full bg-slate-200 text-slate-700 text-[10px] font-bold">6</span>
            </button>
        </nav>

        <div class="flex items-center gap-1.5">
            <button id="headerCopyChatBtn" onclick="copySessionSummary()" class="hidden sm:flex py-1.5 px-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 border border-slate-200/80 items-center gap-1.5 transition-colors" title="Salin Obrolan">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                <span class="hidden xl:inline">Salin</span>
            </button>
            <button onclick="toggleRightPanel(true)" class="lg:hidden p-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 border border-slate-200/80" aria-label="Buka Daftar Riwayat & Catatan" title="Daftar Diskusi & Catatan">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
            </button>
        </div>
    </header>

    <!-- =================================================================== -->
    <!-- BODY 3-PANEL LAYOUT: KIRI | TENGAH | KANAN                          -->
    <!-- =================================================================== -->
    <div class="flex-1 flex min-h-0 overflow-hidden relative">

        <!-- PANEL KIRI -->
        <aside id="leftPanel" class="fixed lg:static inset-y-0 left-0 z-40 w-72 xl:w-76 bg-white border-r border-slate-200/90 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-out shadow-2xl lg:shadow-none">
            <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between lg:hidden">
                <span class="font-bold text-xs uppercase tracking-wider text-slate-500">Kontrol Kendaraan & Mode</span>
                <button onclick="toggleLeftPanel(false)" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-3.5 space-y-4">
                <section class="p-3 rounded-2xl bg-slate-50 border border-slate-200/90 space-y-2.5">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] font-bold uppercase tracking-wider text-slate-600">Pilihan Kendaraan</span>
                        <button onclick="switchView('vehicles')" class="text-[10px] font-semibold text-blue-600 hover:text-blue-700 hover:underline">Kelola</button>
                    </div>

                    <button onclick="openVehicleModal()" class="w-full p-2.5 rounded-xl bg-white hover:bg-blue-50/60 border border-slate-200 hover:border-blue-400 flex items-center justify-between gap-2.5 text-left transition-all shadow-2xs group">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <div id="leftVehicleThumb" class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-[10px] shrink-0 shadow-xs overflow-hidden text-center leading-tight px-1">
                                B13
                            </div>
                            <div class="min-w-0">
                                <span id="leftVehicleCategory" class="text-[10px] font-bold uppercase tracking-wider text-blue-600 block">Mobil</span>
                                <p id="leftVehicleName" class="text-xs font-bold text-slate-900 truncate">Nissan Sentra B13 '96</p>
                                <p id="leftVehicleSub" class="text-[10px] text-slate-500 truncate">GA16DE Injeksi</p>
                            </div>
                        </div>
                        <div class="p-1.5 rounded-lg bg-slate-50 border border-slate-200 text-slate-500 group-hover:text-blue-600 group-hover:border-blue-300 shrink-0 transition-colors" title="Ganti Kendaraan">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 9l4-4 4 4m0 6l-4 4-4-4"/></svg>
                        </div>
                    </button>

                    <button onclick="openGuideModal()" class="w-full py-2 px-3 rounded-xl bg-white hover:bg-blue-50 text-slate-800 hover:text-blue-700 border border-slate-300/90 hover:border-blue-400 text-xs font-semibold flex items-center justify-between transition-colors shadow-2xs">
                        <span class="flex items-center gap-2 truncate">
                            <svg class="w-4 h-4 text-blue-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/></svg>
                            <span id="sidebarGuideLabel" class="truncate">Panduan B13</span>
                        </span>
                        <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </section>

                <section class="p-3 rounded-2xl bg-slate-50 border border-slate-200/90 space-y-3">
                    <div>
                        <span class="text-[11px] font-bold uppercase tracking-wider text-slate-600 block mb-2">Pilihan Mode</span>
                        <div id="modeSelector" class="grid grid-cols-2 gap-1.5"></div>
                    </div>

                    <div class="space-y-2.5 pt-2 border-t border-slate-200/80">
                        <div>
                            <label for="partSelect" class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Bagian</label>
                            <div class="relative">
                                <select id="partSelect" onchange="handleContextChange()" class="w-full appearance-none bg-white border border-slate-300 hover:border-blue-500 rounded-xl pl-3 pr-8 py-2 text-xs font-semibold text-slate-800 shadow-2xs focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-500/15 transition-all cursor-pointer"></select>
                                <svg class="w-3.5 h-3.5 text-slate-600 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                            </div>
                        </div>

                        <div>
                            <label for="conditionSelect" class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Kondisi</label>
                            <div class="relative">
                                <select id="conditionSelect" onchange="handleContextChange()" class="w-full appearance-none bg-white border border-slate-300 hover:border-blue-500 rounded-xl pl-3 pr-8 py-2 text-xs font-semibold text-slate-800 shadow-2xs focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-500/15 transition-all cursor-pointer">
                                    <option value="Umum / Tidak Spesifik">Bebas / Umum</option>
                                    <option value="Saat mesin dingin / starter pagi">Mesin Dingin / Pagi</option>
                                    <option value="Saat mesin sudah panas (suhu kerja)">Mesin Panas (Suhu Kerja)</option>
                                    <option value="Saat akselerasi / tarikan awal / tanjakan">Akselerasi / Tanjakan</option>
                                    <option value="Saat kecepatan tinggi / jalan rata">Kecepatan Tinggi</option>
                                    <option value="Saat idle / langsam / macet">Idle / Langsam / Macet</option>
                                </select>
                                <svg class="w-3.5 h-3.5 text-slate-600 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Footer Panel Kiri: Backup JSON, Kunci PIN & Status Sync -->
            <div class="p-3 border-t border-slate-200/80 bg-slate-50/90 space-y-2">
                <div class="grid grid-cols-2 gap-1.5">
                    <button onclick="exportBackupJson()" class="py-1.5 px-2.5 rounded-xl bg-white hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 border border-slate-300/90 hover:border-emerald-300 text-[11px] font-semibold flex items-center justify-center gap-1.5 transition-colors shadow-2xs" title="Simpan semua data ke file JSON">
                        <svg class="w-3.5 h-3.5 text-emerald-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                        <span>Save JSON</span>
                    </button>
                    <button onclick="triggerImportJson()" class="py-1.5 px-2.5 rounded-xl bg-white hover:bg-blue-50 text-slate-700 hover:text-blue-700 border border-slate-300/90 hover:border-blue-300 text-[11px] font-semibold flex items-center justify-center gap-1.5 transition-colors shadow-2xs" title="Muat kembali data dari file JSON">
                        <svg class="w-3.5 h-3.5 text-blue-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                        <span>Load JSON</span>
                    </button>
                    <input id="jsonFileInput" type="file" accept=".json,application/json" class="hidden" onchange="handleJsonFileSelect(event)">
                </div>

                <div class="flex items-center justify-between gap-2 px-0.5">
                    <p id="syncStatusText" class="text-[10px] text-slate-400 truncate">Menghubungkan Cloud...</p>
                    <button onclick="lockApp()" class="text-[10px] font-semibold text-slate-500 hover:text-rose-600 underline decoration-dotted shrink-0 transition-colors" title="Kunci aplikasi dan minta PIN lagi">
                        Kunci PIN
                    </button>
                </div>
            </div>
        </aside>

        <!-- AREA TENGAH -->
        <main class="flex-1 flex flex-col min-w-0 bg-white relative">
            <div class="px-4 sm:px-6 py-3.5 border-b border-slate-100 bg-white/95 text-center shrink-0">
                <div class="flex items-center justify-center gap-2 max-w-2xl mx-auto">
                    <h2 id="activeHeaderTitle" class="text-lg sm:text-xl font-extrabold text-slate-900 tracking-tight truncate">Sesi Baru</h2>
                    <button id="renameTitleBtn" onclick="openRenameModal()" title="Ubah Judul Diskusi" class="p-1.5 rounded-lg text-slate-400 hover:text-blue-600 hover:bg-blue-50 shrink-0 transition-colors">
                        <svg class="w
